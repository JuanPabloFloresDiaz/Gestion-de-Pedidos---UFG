# Garage (almacén de objetos compatible con S3) para las imágenes de productos y categorías.
# Un solo nodo y sin réplicas: es el entorno de desarrollo. NO usar estos secretos en producción.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "6f1e9a4b2c7d83a05e4b19c6d27f8a3e5b90c1d4e7a62f38b5c0d91e4a7f2b63"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token-cambiar-en-produccion"
